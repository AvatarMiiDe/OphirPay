name: OphirPay CI/CD — 12 Jobs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

# ── Global Concurrency — cancel stale runs on same PR ────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════════
  # 1. LINT — ESLint with zero tolerance
  # ══════════════════════════════════════════════════════════════
  lint:
    name: "1️⃣ Frontend — Lint (ESLint)"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc', cache: "npm" }
      - run: npm ci
      - run: npx next lint --max-warnings 20

  # ══════════════════════════════════════════════════════════════
  # 2. TYPECHECK — TypeScript strict type-checking
  # ══════════════════════════════════════════════════════════════
  typecheck:
    name: "2️⃣ Frontend — TypeCheck (tsc)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc', cache: "npm" }
      - run: npm ci
      - run: npx tsc --noEmit

  # ══════════════════════════════════════════════════════════════
  # 3. UNIT TESTS — Vitest (68 frontend tests)
  # ══════════════════════════════════════════════════════════════
  unit-tests:
    name: "3️⃣ Frontend — Unit Tests (Vitest)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc', cache: "npm" }
      - run: npm ci
      - run: npx prisma generate
      - run: npx vitest run --reporter=verbose

  # ══════════════════════════════════════════════════════════════
  # 4. TEST COVERAGE — Vitest coverage with thresholds
  # ══════════════════════════════════════════════════════════════
  test-coverage:
    name: "4️⃣ Frontend — Coverage (Vitest)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc', cache: "npm" }
      - run: npm ci
      - run: npx prisma generate
      - run: npx vitest run --coverage --reporter=verbose
      - name: Upload coverage to artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ══════════════════════════════════════════════════════════════
  # 5. CONTRACT WASM BUILD — Build both Soroban contracts
  # ══════════════════════════════════════════════════════════════
  contract-wasm:
    name: "5️⃣ Backend — Contracts (WASM)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Soroban SDK deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq build-essential
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/ophirpay/target
            contracts/emitter/target
          key: cargo-${{ runner.os }}-${{ hashFiles('contracts/**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Build OphirPay contract
        run: cd contracts/ophirpay && cargo build --target wasm32-unknown-unknown --release
      - name: Build Emitter contract
        run: cd contracts/emitter && cargo build --target wasm32-unknown-unknown --release
      - name: Verify WASM artifacts
        run: |
          ls -lh contracts/ophirpay/target/wasm32-unknown-unknown/release/*.wasm
          ls -lh contracts/emitter/target/wasm32-unknown-unknown/release/*.wasm
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: |
            contracts/ophirpay/target/wasm32-unknown-unknown/release/*.wasm
            contracts/emitter/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 7

  # ══════════════════════════════════════════════════════════════
  # 6. NEXT.JS BUILD — Production build verification
  # ══════════════════════════════════════════════════════════════
  next-build:
    name: "6️⃣ Frontend — Build (Next.js)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc', cache: "npm" }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: Verify build output
        run: |
          test -d .next && echo "✅ .next directory exists"
          test -f .next/BUILD_ID && echo "✅ BUILD_ID exists"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 1

  # ══════════════════════════════════════════════════════════════
  # 7. SMOKE TEST — HTTP checks against live Vercel (no browser)
  # ══════════════════════════════════════════════════════════════
  smoke-test:
    name: "7️⃣ Frontend — Smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test all pages (curl)
        run: |
          BASE="https://ophirpay.vercel.app"
          PAGES=("/" "/send" "/payments" "/batches" "/recurring" "/requests" \
                  "/webhooks" "/contracts" "/analytics" "/events" \
                  "/multisig" "/governance" "/audit-log" "/refunds" \
                  "/hooks" "/rbac" "/fee-config" "/timelock" "/policy-versions")
          FAIL=0
          for page in "${PAGES[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE$page")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "304" ]; then
              echo "  ✅ $page ($STATUS)"
            else
              echo "  ❌ $page ($STATUS)"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then echo "❌ Smoke test failed"; exit 1; fi
          echo "✅ All 19 pages healthy"

  # ══════════════════════════════════════════════════════════════
  # 8. PRISMA VALIDATE — Schema integrity, generate, db push
  # ══════════════════════════════════════════════════════════════
  prisma-validate:
    name: "8️⃣ Backend — Prisma (Validate + DB)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: ophirpay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc', cache: "npm" }
      - run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://prisma:prisma@localhost:5432/ophirpay_ci
          DIRECT_DATABASE_URL: postgresql://prisma:prisma@localhost:5432/ophirpay_ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Push schema to test DB (catches runtime schema errors)
        run: |
          npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: postgresql://prisma:prisma@localhost:5432/ophirpay_ci
          DIRECT_DATABASE_URL: postgresql://prisma:prisma@localhost:5432/ophirpay_ci
      - name: Check for drift (schema vs migrations)
        run: |
          # If migrations exist, diff must be empty; if none exist yet, skip
          if [ -d prisma/migrations ] && [ "$(ls -A prisma/migrations 2>/dev/null)" ]; then
            npx prisma migrate diff \
              --from-migrations prisma/migrations \
              --to-schema-datamodel prisma/schema.prisma \
              --shadow-database-url "postgresql://prisma:prisma@localhost:5432/ophirpay_ci_shadow"
            echo "✅ No schema drift detected"
          else
            echo "ℹ️  No migrations directory yet — skipping drift check"
          fi
        env:
          DATABASE_URL: postgresql://prisma:prisma@localhost:5432/ophirpay_ci
          DIRECT_DATABASE_URL: postgresql://prisma:prisma@localhost:5432/ophirpay_ci

  # ══════════════════════════════════════════════════════════════
  # 10. K8S VALIDATE — kubeconform on manifests
  # ══════════════════════════════════════════════════════════════
  k8s-validate:
    name: "9️⃣ Infra — K8s (kubeconform)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate Kubernetes manifests
        run: kubeconform -summary -strict k8s/
      - name: Validate against Kubernetes JSON schemas (strict)
        run: |
          kubeconform \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json' \
            -summary -strict \
            k8s/

  # ══════════════════════════════════════════════════════════════
  # 12. HELM LINT — Helm chart validation
  # ══════════════════════════════════════════════════════════════
  helm-lint:
    name: "🔟 Infra — Helm (Lint)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest 2>/dev/null || true
      - name: Lint Helm chart
        run: helm lint helm/ophirpay --strict
      - name: Template rendering check
        run: |
          helm template ophirpay helm/ophirpay \
            --set image.tag=ci-test \
            --set ingress.enabled=false \
            > /tmp/rendered.yaml && \
            echo "✅ Helm chart renders successfully ($(wc -l < /tmp/rendered.yaml) lines)"

  # ══════════════════════════════════════════════════════════════
  # 11. DEPENDENCY AUDIT — npm audit for vulnerabilities
  # ══════════════════════════════════════════════════════════════
  dependency-audit:
    name: "1️⃣1️⃣ Backend — Audit (npm)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true  # Don't block PRs, just surface warnings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc', cache: "npm" }
      - name: npm audit (production deps only, no fix)
        run: npm audit --omit=dev --audit-level=high 2>&1 || true
      - name: npm audit (all deps, report only)
        run: npm audit --audit-level=critical 2>&1 || true

  # ══════════════════════════════════════════════════════════════
  # 15. PR LABELER — Auto-label PRs by changed paths
  # ══════════════════════════════════════════════════════════════
  pr-labeler:
    name: "1️⃣2️⃣ Meta — PR Labeler"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

[toolchain]
# Locked for reproducible Soroban contract builds.
# Minimum: 1.88.0 for MSRV of soroban-sdk 22.x transitive deps.
# WASM builds work on any Rust >= 1.88.
# Native tests (soroban-env-host) may need Rust < 1.97 due to ed25519-dalek.
channel = "1.88.0"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
